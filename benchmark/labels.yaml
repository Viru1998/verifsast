  - file: cases/path_traversal/safe_08.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
    description: "zipfile extract with per-member validation — rejects absolute paths and '..' components"

  - file: cases/path_traversal/safe_09.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
