  - file: cases/cmdi/vuln_03.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "subprocess.run(f-string, shell=True) — f-string embeds user-controlled host/domain"

  - file: cases/cmdi/vuln_04.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "os.popen('ls ' + path) — popen opens a shell with user-controlled argument"

  - file: cases/cmdi/vuln_05.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "subprocess.Popen(shell=True) with .format()-built command string from user input"

  - file: cases/cmdi/vuln_06.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "eval(user_code) — arbitrary Python code execution from user input"

  - file: cases/cmdi/vuln_07.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "exec(user_code) — arbitrary Python code execution via exec()"

  - file: cases/cmdi/vuln_08.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "subprocess.check_output('grep ' + pattern, shell=True) — user pattern injectable"

  - file: cases/cmdi/vuln_09.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "os.system() with .format()-built command from user-controlled paths and values"

  - file: cases/cmdi/vuln_10.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
    description: "Flask route passes request.args values to subprocess.run(shell=True)"

  - file: cases/cmdi/safe_01.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "subprocess.run([cmd, arg1, arg2]) — list form bypasses shell entirely"

  - file: cases/cmdi/safe_02.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "shlex.split() to tokenise command; user value appended as separate list element"

  - file: cases/cmdi/safe_03.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "shlex.quote() wraps user input so shell treats it as a single literal argument"

  - file: cases/cmdi/safe_04.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "Hardcoded commands only — no user input reaches any subprocess call"

  - file: cases/cmdi/safe_05.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "subprocess.call([cmd, arg], shell=False) — explicit list, no shell"

  - file: cases/cmdi/safe_06.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "Command selected from a whitelist dict; user only supplies the key, not the command"

  - file: cases/cmdi/safe_07.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "subprocess.run() with explicit shell=False and list arguments"

  - file: cases/cmdi/safe_08.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "os.system() called only with hardcoded literal strings"

  - file: cases/cmdi/safe_09.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "Input validated against strict [a-zA-Z0-9._-]+ regex before use in subprocess list"

  - file: cases/cmdi/safe_10.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: safe
    description: "File operations performed with pathlib/shutil — no shell subprocess invoked at all"

  # ── Path Traversal (CWE-22) ──────────────────────────────────────────────────
  - file: cases/path_traversal/vuln_01.py
