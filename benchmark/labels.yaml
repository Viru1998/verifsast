  - file: cases/path_traversal/safe_04.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
    description: "File path selected from a hardcoded whitelist dict — user only chooses a key"

  - file: cases/path_traversal/safe_05.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
