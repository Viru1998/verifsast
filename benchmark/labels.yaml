cases:
  # ── SQL Injection (CWE-89) ───────────────────────────────────────────────────
  - file: cases/sqli/vuln_01.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "% string format operator embeds user input into SQL execute()"

  - file: cases/sqli/vuln_02.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "f-string embeds user input directly into SELECT and DELETE queries"

  - file: cases/sqli/vuln_03.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "String concatenation (+ operator) builds SQL from user input"

  - file: cases/sqli/vuln_04.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: ".format() interpolates user-controlled slug and status into SQL"

  - file: cases/sqli/vuln_05.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "Dynamic ORDER BY clause built with string concatenation from user input"

  - file: cases/sqli/vuln_06.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "Flask request.args values concatenated or f-stringed into SQL queries"

  - file: cases/sqli/vuln_07.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "Python % operator (not psycopg2 params) formats user input into SQL before driver sees it"

  - file: cases/sqli/vuln_08.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "Multi-parameter login query built with Python % formatting — both username and password injectable"

  - file: cases/sqli/vuln_09.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "UPDATE statements built with f-strings from user-supplied email, bio, and location"

  - file: cases/sqli/vuln_10.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: vulnerable
    description: "DELETE statement with concatenated table name and condition — both from user input"

  - file: cases/sqli/safe_01.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "sqlite3 ? placeholder with parameter tuple — canonical safe pattern"

  - file: cases/sqli/safe_02.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "psycopg2 %s placeholder (driver parameterisation, NOT Python % formatting)"

  - file: cases/sqli/safe_03.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "SQLAlchemy ORM .filter() — ORM generates parameterised queries internally"

  - file: cases/sqli/safe_04.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "Fully hardcoded SQL queries with zero user-controlled input"

  - file: cases/sqli/safe_05.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "SQLAlchemy text() with named :param bindparams"

  - file: cases/sqli/safe_06.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "sqlite3 named dict params (:name placeholders) with parameter dict"

  - file: cases/sqli/safe_07.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "Column name validated against a whitelist set before f-string use; value uses ? placeholder"

  - file: cases/sqli/safe_08.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "User input cast to int() before parameterised query — non-integer raises ValueError"

  - file: cases/sqli/safe_09.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "Django ORM .filter() — framework generates parameterised SQL"

  - file: cases/sqli/safe_10.py
    class: sqli
    cwe: CWE-89
    owasp: A05
    label: safe
    description: "Builds SQL-like display/log strings that are never executed against a database"

  # ── OS Command Injection (CWE-78) ────────────────────────────────────────────
  - file: cases/cmdi/vuln_01.py
    class: cmdi
    cwe: CWE-78
    owasp: A03
    label: vulnerable
