  - file: cases/path_traversal/safe_06.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
    description: "Fully hardcoded file paths — no user input in any open() call"

  - file: cases/path_traversal/safe_07.py
    class: path_traversal
    cwe: CWE-22
    owasp: A01
    label: safe
